name: SPJ Critical Verification

on:
  push:
    branches:
      - gui-standardization
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - gui-standardization
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spj-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and SPJ critical tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, zip, gd, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views
          touch database/testing.sqlite

      - name: Resolve Symfony lock for PHP 8.3
        run: composer update "symfony/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Verify PHP dependencies from repaired lock
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Repository Pint check (advisory)
        continue-on-error: true
        run: php vendor/bin/pint --test

      - name: Frontend build
        run: npm run build

      - name: Blade compile check
        run: php artisan view:cache --no-interaction

      - name: SPJ critical tests
        run: php artisan test --testsuite="SPJ Critical" --compact

      - name: Full unit test suite
        run: php artisan test --testsuite="Unit" --compact

      - name: Full feature test suite
        run: php artisan test --testsuite="Feature" --compact

      - name: Commit repaired dependency lock
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/gui-standardization'
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already compatible; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "fix: keep dependency lock compatible with PHP 8.3"
          git push
